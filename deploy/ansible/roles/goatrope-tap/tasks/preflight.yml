---
# Every refusal, from the archive about to be installed (or gone back to), before anything moves.
- name: goatrope-tap | preflight | this host's architecture, as releases name it
  ansible.builtin.set_fact:
    _gt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture, ansible_facts.architecture) }}"

- name: goatrope-tap | preflight | the release has a file for this host
  ansible.builtin.assert:
    that: _gt_arch in release_file_files
    fail_msg: "goatrope's release has no file for {{ _gt_arch }}: nothing changed"
    quiet: true
  when:
    - release_file_files | default({}) | length > 0
    - not (release_file_rollback | default(false) | bool)

- name: goatrope-tap | preflight | run goatrope's refusals
  ansible.builtin.include_tasks: run.yml
  vars:
    _gt_link: "{{ goatrope_release_home }}/{{ 'previous' if release_file_rollback | default(false) | bool else 'current' }}"
    _gt_src: "{{ {} if release_file_rollback | default(false) | bool else (release_file_files | default({})).get(_gt_arch, {}) }}"
    _gt_dry: true
