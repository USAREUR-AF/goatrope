[package]
name = "goatrope"
# The released version is the VERSION file; the binary reads it at build time.
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[dependencies]
libc = "0.2.191"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.34.0"
netlink-sys = "0.9.0"
serde_json = "1.0.154"
sha2 = "0.11.0"
toml = { version = "0.9", default-features = false, features = ["parse", "std", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# WireGuard through generic netlink; the boundary key generated and turned into its public key in process.
netlink-packet-generic = "=0.5.0"
netlink-packet-wireguard = "=0.5.1"
x25519-dalek = { version = "=2.0.1", default-features = false }
getrandom = "=0.3.4"
# The converter of decode-and-send, linked (docs/adr/0006-data-path.md): standard library only, no
# dependencies of its own. The commit is the pin; src/engine.rs names it and a test holds it to Cargo.lock.
goat-transformers = { git = "https://github.com/USAREUR-AF/goat-transformers", rev = "37d243021cb404f1f090d36d64d9bb567f60b126" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
