# The parsers of untrusted input, fuzzed (#44): a minute each on every pull request, half an hour
# each every week. A crash fails the job and its input is kept as an artifact.
name: fuzz

on:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [frame, arp, declaration, convert]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz
        run: |
          seconds=60
          [ "${{ github.event_name }}" = pull_request ] || seconds=1800
          cargo +nightly fuzz build ${{ matrix.target }}
          rev=$(sed -n 's/^pub const COMMIT: &str = "\(.*\)";/\1/p' src/engine.rs)
          packs=$(ls -d "$HOME"/.cargo/git/checkouts/goat-transformers-*/"${rev:0:7}"/packs | head -1)
          GOATROPE_FUZZ_PACKS="$packs" cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time="$seconds" -rss_limit_mb=4096
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts
