# Build, sign and publish a release on a tag goatrope-v<version>.
#
# One archive (the code is Python 3 standard library only, so it serves arm64 and
# amd64) and SHA256SUMS. SHA256SUMS is signed keylessly with cosign (this
# workflow's OIDC identity, no stored key), and the archive gets a GitHub build
# provenance attestation, as the sibling repositories do. Verify with:
#
#   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/<owner>/goatrope/\.github/workflows/release\.yml@refs/tags/goatrope-v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
#   sha256sum -c --ignore-missing SHA256SUMS
#   gh attestation verify goatrope-<version>.tar.gz --repo <owner>/goatrope
name: release

on:
  push:
    tags: ['goatrope-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release
      id-token: write        # keyless cosign and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version from the tag must equal VERSION
        id: v
        run: |
          v="${GITHUB_REF_NAME#goatrope-v}"
          test "$v" = "$(cat VERSION)" || { echo "::error::tag $v but VERSION $(cat VERSION)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Archive and SHA256SUMS
        run: tools/build-release.sh "${{ steps.v.outputs.version }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes --new-bundle-format --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --new-bundle-format --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/goatrope-${{ steps.v.outputs.version }}.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "goatrope ${{ steps.v.outputs.version }}" \
            --notes "See CHANGELOG.md. Verify: sha256sum -c --ignore-missing SHA256SUMS, and cosign verify-blob with SHA256SUMS.sigstore.json (commands in .github/workflows/release.yml)." \
            dist/goatrope-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
