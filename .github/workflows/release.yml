# Build, sign and publish a release on a tag goatrope-v<version>.
#
# The release is exactly three files:
#   goatrope-<version>.tar.gz   the code is Python 3 standard library only, so one archive serves
#                               arm64 and amd64
#   SHA256SUMS                  the archive's SHA-256
#   SHA256SUMS.cosign-bundle    the keyless signature over SHA256SUMS by this workflow at the tag,
#                               in cosign's legacy bundle format
# The archive also gets a GitHub build provenance attestation, which is not a release file. Verify:
#
#   cosign verify-blob --bundle SHA256SUMS.cosign-bundle \
#     --certificate-identity https://github.com/USAREUR-AF/goatrope/.github/workflows/release.yml@refs/tags/goatrope-v<version> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
#   sha256sum -c SHA256SUMS
#   gh attestation verify goatrope-<version>.tar.gz --repo USAREUR-AF/goatrope
name: release

on:
  push:
    tags: ['goatrope-v*']

permissions:
  contents: read

jobs:
  bin:
    name: binary ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tools/build-bin.sh
      - run: file "bin/${{ matrix.arch }}/goatrope" | grep -qE 'static-pie linked|statically linked'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bin-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}/goatrope
          if-no-files-found: error

  build:
    needs: bin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write        # create the release
      id-token: write        # keyless cosign and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version from the tag must equal VERSION
        id: v
        run: |
          v="${GITHUB_REF_NAME#goatrope-v}"
          test "$v" = "$(cat VERSION)" || { echo "::error::tag $v but VERSION $(cat VERSION)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bin-x86_64
          path: bin/x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bin-aarch64
          path: bin/aarch64
      - run: chmod 0755 bin/x86_64/goatrope bin/aarch64/goatrope
      - name: Archive and SHA256SUMS
        run: tools/build-release.sh "${{ steps.v.outputs.version }}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: |
          # cosign v2 writes the legacy bundle without --new-bundle-format; v3 does not, so v2 is pinned.
          cosign sign-blob --yes --bundle SHA256SUMS.cosign-bundle SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.cosign-bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: The release is exactly the three files
        run: tools/check-release.sh "${{ steps.v.outputs.version }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/goatrope-${{ steps.v.outputs.version }}.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "goatrope ${{ steps.v.outputs.version }}" \
            --notes "See CHANGELOG.md. The commands that verify it are in .github/workflows/release.yml." \
            "dist/goatrope-${{ steps.v.outputs.version }}.tar.gz" dist/SHA256SUMS dist/SHA256SUMS.cosign-bundle
