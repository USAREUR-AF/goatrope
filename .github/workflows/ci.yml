name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: compile, validate examples, shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python compiles with the system interpreter (standard library only)
        run: python3 -m py_compile goatrope/*.py tests/netns/test_tap.py
      - name: Rust formatting, lints and unit tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: The static binary
        run: sudo apt-get install -y musl-tools && tools/build-bin.sh
      - name: Every example declaration validates
        run: for f in examples/*.toml; do ./bin/goatrope validate --config "$f"; done
      - name: shellcheck
        run: shellcheck bin/goatrope tests/netns/run.sh tests/arm64/run.sh tools/*.sh
      - name: VERSION agrees with the package and the binary
        run: |
          test "$(python3 -I -c 'import sys; sys.path.insert(0, "."); import goatrope; print(goatrope.VERSION)')" = "$(cat VERSION)"
          test "$(./bin/goatrope --version)" = "goatrope $(cat VERSION)"

  netns:
    name: namespace tests, Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The static binary and its unit-test binary
        run: sudo apt-get install -y musl-tools && GOATROPE_BUILD_UNITS=1 tools/build-bin.sh
      - name: Run (privileged container with systemd as PID 1, veth pairs, namespaces)
        run: OUT="$RUNNER_TEMP/results" tests/netns/run.sh "${{ matrix.ubuntu }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: netns-ubuntu-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/results

  arm64:
    name: arm64 binary builds and validates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get install -y musl-tools && tools/build-bin.sh
      - run: for f in examples/*.toml; do ./bin/goatrope validate --config "$f"; done
      - run: file bin/aarch64/goatrope | grep -qE 'static-pie linked|statically linked'

  reuse:
    name: REUSE
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install 'reuse==5.0.2' && reuse lint
